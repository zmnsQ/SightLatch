name: Build ESP32 family firmware and USB installer
on:
  push:
    paths: ['firmware/**', 'web-installer/**', 'scripts/*firmware*', '.github/workflows/firmware-web.yml']
  pull_request:
    paths: ['firmware/**', 'web-installer/**', 'scripts/*firmware*', '.github/workflows/firmware-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned official toolchain
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ArduinoJson@7.0.4
      - name: Compile actual ESP32 / C3 / S3 images and generate manifest
        run: |
          scripts/build_firmware.sh
          scripts/build_extended_firmware.sh
          python3 scripts/verify_firmware.py
          python3 tests/check_c3_firmware.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-installer/package-lock.json
      - name: Test and build installer
        working-directory: web-installer
        run: npm ci && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sightlatch-c3-web-installer
          path: web-installer/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sightlatch-c3-build-evidence
          path: firmware/build/
# No Pages permission or automatic deployment. Enable hosting separately with owner consent.
