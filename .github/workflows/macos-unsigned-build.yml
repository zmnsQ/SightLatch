name: Manual unsigned iOS compile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check installed SDK (Xcode 26 or newer required)
        shell: bash
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK%%.*}" -ge 26 || { echo "Select a hosted runner with Xcode 26+; no SDK is downloaded by this workflow."; exit 1; }
      - name: Compile all three targets without signing or running
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/HIDPilot.xcodeproj -scheme HIDPilot \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Retain compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-build-log
          path: build.log
